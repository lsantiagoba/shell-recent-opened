<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- SPDX-FileCopyrightText: 2026 lsbcodes -->
  <!-- SPDX-License-Identifier: GPL-2.0-or-later -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8e7e4"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbe6f"/>
      <stop offset="1" stop-color="#ff7800"/>
    </linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
  </defs>

  <!-- A recent document, leaning left -->
  <g transform="rotate(-12 46 46)">
    <rect x="20" y="10" width="52" height="66" rx="8" fill="#000" opacity="0.15" transform="translate(0 2)"/>
    <rect x="20" y="10" width="52" height="66" rx="8" fill="url(#page)"/>
    <rect x="29" y="22" width="34" height="5" rx="2.5" fill="#c0bfbc"/>
    <rect x="29" y="32" width="26" height="5" rx="2.5" fill="#c0bfbc"/>
    <rect x="29" y="42" width="30" height="5" rx="2.5" fill="#c0bfbc"/>
  </g>

  <!-- A recent application, leaning right -->
  <g transform="rotate(12 84 40)">
    <rect x="58" y="14" width="52" height="52" rx="14" fill="#000" opacity="0.15" transform="translate(0 2)"/>
    <rect x="58" y="14" width="52" height="52" rx="14" fill="url(#tile)"/>
    <rect x="72" y="28" width="24" height="24" rx="6" fill="#fff" opacity="0.9"/>
  </g>

  <!-- The tray holding them, with GNOME-style bottom depth -->
  <rect x="10" y="58" width="108" height="62" rx="18" fill="#1a5fb4"/>
  <rect x="10" y="54" width="108" height="60" rx="18" fill="url(#tray)"/>
  <rect x="28" y="54" width="72" height="2" rx="1" fill="#fff" opacity="0.3"/>

  <!-- History clock: counter-clockwise arrow around clock hands -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M47.5 91 A17 17 0 1 0 52.5 74.5" stroke-width="6"/>
    <path d="M64 75 v10 l7 5" stroke-width="5.5"/>
  </g>
  <path d="M43.5 70 l13.5 0 l-7.5 11.5 z" fill="#fff" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
